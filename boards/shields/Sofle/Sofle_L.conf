# --- Disable privacy to avoid RPA-related bond issues ---
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_ENFORCE_MITM=n

CONFIG_BT_PRIVACY=n
CONFIG_BT_CTLR_PRIVACY=n

# --- Give SMP more time / reduce chance of timeout ---
CONFIG_BT_CONN_TX_MAX=12

CONFIG_BT_DEBUG_LOG=y
CONFIG_ZMK_USB_LOGGING=y

CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n